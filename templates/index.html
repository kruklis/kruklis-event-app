<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BigQuery Release Notes & Updates</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top App Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <!-- BigQuery SVG Icon -->
        <svg class="bq-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM19 18H6c-2.21 0-4-1.79-4-4 0-2.05 1.53-3.76 3.56-3.97l1.07-.11.5-.95C8.08 7.14 9.94 6 12 6c2.62 0 4.88 1.86 5.39 4.43l.3 1.5 1.53.11c1.56.1 2.78 1.41 2.78 2.96 0 1.65-1.35 3-3 3z" fill="#4285F4"/>
          <path d="M9 13h6v2H9z" fill="#4285F4"/>
          <path d="M11 10h2v8h-2z" fill="#4285F4"/>
        </svg>
        <div>
          <h1 class="brand-title">BigQuery Release Notes</h1>
          <p class="brand-subtitle">Official feed from Google Cloud Platform</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="meta-status">
          <span class="status-dot"></span>
          <span id="last-updated-text">Fetching latest updates...</span>
        </div>

        <button id="refresh-btn" class="btn btn-primary" title="Refresh release notes">
          <svg class="icon spinner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span class="btn-text">Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-container">

    <!-- Filters & Search Toolbar -->
    <section class="toolbar-section">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search features, tools, fixes, keywords (e.g. TabFM, SQL, JDBC)..." autocomplete="off">
        <button id="clear-search" class="clear-btn" style="display: none;" title="Clear search">&times;</button>
      </div>

      <div class="filter-pills" id="filter-pills">
        <button class="pill active" data-type="ALL">All Updates (<span id="count-all">0</span>)</button>
        <button class="pill" data-type="Feature">Features (<span id="count-feature">0</span>)</button>
        <button class="pill" data-type="Change">Changes (<span id="count-change">0</span>)</button>
        <button class="pill" data-type="Fixed">Fixes (<span id="count-fixed">0</span>)</button>
        <button class="pill" data-type="Announcement">Announcements (<span id="count-announcement">0</span>)</button>
      </div>
    </section>

    <!-- Notification / Warning banner if needed -->
    <div id="notice-banner" class="notice-banner" style="display: none;"></div>

    <!-- Active Selection Float Bar -->
    <div id="selection-bar" class="selection-bar" style="display: none;">
      <div class="selection-bar-content">
        <div class="selection-info">
          <span class="selection-badge">1 update selected</span>
          <span id="selection-preview-title" class="selection-title"></span>
        </div>
        <div class="selection-actions">
          <button id="bar-compose-btn" class="btn btn-x">
            <svg class="icon x-logo" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
            </svg>
            Tweet Selected Update
          </button>
          <button id="clear-selection-btn" class="btn btn-secondary">Deselect</button>
        </div>
      </div>
    </div>

    <!-- Feed Content / Results -->
    <section id="releases-container" class="releases-container">
      <div class="loading-state">
        <div class="big-spinner"></div>
        <p>Loading BigQuery release notes...</p>
      </div>
    </section>

  </main>

  <!-- Tweet Composer Modal -->
  <div id="tweet-modal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <svg class="modal-x-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <div>
            <h3>Compose Tweet</h3>
            <p class="modal-subtitle">Share this BigQuery update with your followers</p>
          </div>
        </div>
        <button id="close-modal-btn" class="close-modal-btn" title="Close modal">&times;</button>
      </div>

      <div class="modal-body">
        <div class="tweet-context">
          <span id="modal-update-badge" class="type-badge badge-feature">Feature</span>
          <span id="modal-update-date" class="modal-date-label"></span>
        </div>

        <div class="tweet-editor-wrapper">
          <textarea id="tweet-textarea" rows="6" placeholder="What's happening in BigQuery?"></textarea>
          <div class="tweet-editor-footer">
            <span id="char-counter" class="char-counter">280</span>
          </div>
        </div>

        <div class="tweet-preview-meta">
          <div class="source-link-preview">
            <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span id="modal-link-display"></span>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button id="copy-tweet-btn" class="btn btn-secondary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-btn-text">Copy Text</span>
        </button>
        <button id="launch-tweet-btn" class="btn btn-x-primary">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          Post on X / Twitter
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast" class="toast"></div>

  <script src="/static/script.js"></script>
</body>
</html>
